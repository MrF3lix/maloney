# Pick the torch build with an accelerator extra, `uv sync --extra <accel>`: cu128 for Volta and
# newer (sm_70+), cu126 for Pascal GPUs like the P40 (sm_61, dropped from the cu128+ builds), rocm
# for AMD. Without an extra, PyPI's torch is used (CPU/MPS on macOS, sm_75+ only on Linux).
[project]
name = "maloney"
version = "0.1.0"
description = "Geolocation-aware Swiss German dialect identification from speech (STT4SG-350)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.8",
    "numpy>=2.0",
    "omegaconf>=2.3.1",
    "pandas>=2.2",
    "rootutils>=1.0.7",
    "shapely>=2.2.0",
    "soundfile>=0.13",
    "soxr>=0.5",
    "torch>=2.6",
    "transformers>=5.20.2",
]

[project.optional-dependencies]
cu126 = ["torch==2.8.0"]
cu128 = ["torch==2.8.0"]
rocm = [
    "torch==2.11.0",
    "triton-rocm; platform_machine == 'x86_64' and sys_platform == 'linux'",
]
wandb = ["wandb"]
geo = [
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]

[project.scripts]
train = "maloney.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maloney"]

[tool.uv]
conflicts = [[{ extra = "cu126" }, { extra = "cu128" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
