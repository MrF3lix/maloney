[project]
name = "maloney"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.8",
    "numpy>=2.5.4",
    "omegaconf>=2.3.1",
    "pandas>=3.1.0",
    "rootutils>=1.0.7",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "torch>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maloney"]

[project.scripts]
train = "maloney.train:main"
